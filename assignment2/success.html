<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Success Page</title>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:#eaf6ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    width:350px;
    box-shadow:0 10px 25px rgba(0,123,255,0.2);
    text-align:center;
}

h2{
    color:green;
}

.info{
    text-align:left;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="card">

    <h2>Login Successful 🎉</h2>

    <div class="info">
        <p><b>Name:</b> <span id="name"></span></p>
        <p><b>Email:</b> <span id="email"></span></p>
        <p><b>Password:</b> <span id="password"></span></p>
        <p><b>Gender:</b> <span id="gender"></span></p>
    </div>

</div>

<script>

document.getElementById("name").innerText = localStorage.getItem("name");
document.getElementById("email").innerText = localStorage.getItem("email");
document.getElementById("password").innerText = localStorage.getItem("password");
document.getElementById("gender").innerText = localStorage.getItem("gender");

</script>

</body>
</html>
